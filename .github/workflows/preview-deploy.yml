name: Preview Deployment

on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
      - main

jobs:
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit verification

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm check-types

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate with Vercel
        run: |
          echo "${{ secrets.VERCEL_TOKEN }}" | vercel login --token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy all apps to Preview
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployments ready!\n\nAll apps have been deployed to Vercel preview. Check the Vercel dashboard for URLs.'
            })
