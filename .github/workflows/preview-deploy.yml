name: Preview Deployment

on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
      - main

jobs:
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm check-types

      - name: Build applications
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        working-directory: ./apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json << EOF
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectName": "web"
          }
          EOF
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Preview
        id: deploy
        working-directory: ./apps/web
        run: |
          vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes --force 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' deploy.log | head -1)
          if [ -z "$URL" ]; then
            URL=$(grep -o 'https://[^ ]*' deploy.log | head -1)
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready!\n\n**Web App:** ${{ steps.deploy.outputs.url }}'
            })

